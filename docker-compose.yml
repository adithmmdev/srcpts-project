version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: srcpts_db
    environment:
      POSTGRES_DB: srcpts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: srcpts_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/srcpts
      JWT_SECRET: srcpts_super_secret_jwt_key_2024
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: srcpts_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
